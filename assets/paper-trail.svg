<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Task 019 across four places: the roadmap entry, the ledger line in .foreman/notes.jsonl, a [Foreman: 019] anchor comment in your own code, and a Foreman: 019 trailer on the commit message"><style>.card{fill:#fcfcfb}.card{stroke:rgba(11,11,11,.07)}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.bp{fill:#dcd9d0}.cw{fill:#e3f2e3}.cwt{fill:#0a6b0a}.cf{fill:#f0efeb}.cft{fill:#52514e}.ac{fill:#16a34a}.nd{fill:#16a34a}.stp{fill:#f0f4ef}.stw{fill:#e3f2e6}@media(prefers-color-scheme:dark){.card{fill:#161b22}.card{stroke:#30363d}.ink{fill:#e6edf3}.ink2{fill:#b0b8c0}.mut{fill:#9198a1}.bp{fill:#3d3c37}.cw{fill:#17301f}.cwt{fill:#3fb950}.cf{fill:#2b2b29}.cft{fill:#9198a1}.ac{fill:#22c55e}.nd{fill:#22c55e}.stp{fill:#1e2620}.stw{fill:#1c3524}}</style><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b0b0b" flood-opacity=".10"/></filter><rect class="card" x="8" y="6" width="684" height="292" rx="18" filter="url(#s)"/><text class="ink" x="36" y="48" font-size="21" font-weight="800">One task, one id</text><text class="mut" x="36" y="70" font-size="14.5">task 019 &#8212; &#8220;expire sessions server-side&#8221; &#8212; from roadmap entry to git history</text><rect class="stp" x="36" y="90" width="148" height="96" rx="14"/><circle class="nd" cx="110" cy="114" r="13"/><text x="110" y="119" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text><text class="ink2" x="110" y="146" font-size="13.5" text-anchor="middle">roadmap</text><text class="ink" x="110" y="166" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">&quot;id&quot;: &quot;019&quot;</text><rect class="stp" x="196" y="90" width="148" height="96" rx="14"/><circle class="nd" cx="270" cy="114" r="13"/><text x="270" y="119" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text><text class="ink2" x="270" y="146" font-size="13.5" text-anchor="middle">ledger line</text><text class="ink" x="270" y="166" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">notes.jsonl</text><rect class="stp" x="356" y="90" width="148" height="96" rx="14"/><circle class="nd" cx="430" cy="114" r="13"/><text x="430" y="119" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">3</text><text class="ink2" x="430" y="146" font-size="13.5" text-anchor="middle">code anchor</text><text class="ink" x="430" y="166" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">[Foreman: 019]</text><rect class="stw" x="516" y="90" width="148" height="96" rx="14"/><circle class="nd" cx="590" cy="114" r="13"/><text x="590" y="119" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">4</text><text class="ink2" x="590" y="146" font-size="13.5" text-anchor="middle">commit</text><text class="ac" x="590" y="166" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Foreman: 019</text><rect class="nd" x="36" y="213" width="5" height="5"/><text class="ink2" x="52" y="218" font-size="14">Open a file that carries an anchor &#8594; Foreman hands you what it recorded, before you change it.</text><rect class="nd" x="36" y="241" width="5" height="5"/><text class="ink2" x="52" y="246" font-size="14">Commit mid-task &#8594; Foreman reads the trailer and knows which task that commit closed.</text><rect class="nd" x="36" y="269" width="5" height="5"/><text class="ink2" x="52" y="274" font-size="14">Six months later &#8594; <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">git log --grep=&quot;Foreman: 019&quot;</tspan> is the whole trail.</text></svg>
