<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Task 019 across four places: the roadmap entry, the ledger line in .foreman/notes.jsonl, a [Foreman: 019] anchor comment in your own code, and a Foreman: 019 trailer on the commit message"><style>.card{fill:#fcfcfb}.card{stroke:rgba(11,11,11,.07)}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}.bp{fill:#dcd9d0}.cw{fill:#e3f2e3}.cwt{fill:#0a6b0a}.cf{fill:#f0efeb}.cft{fill:#52514e}.ac{fill:#21553b}.nd{fill:#21553b}.stp{fill:#f0f4ef}.stw{fill:#e3f2e6}@media(prefers-color-scheme:dark){.card{fill:#161b22}.card{stroke:#30363d}.ink{fill:#e6edf3}.ink2{fill:#b0b8c0}.mut{fill:#9198a1}.bp{fill:#3d3c37}.cw{fill:#17301f}.cwt{fill:#3fb950}.cf{fill:#2b2b29}.cft{fill:#9198a1}.ac{fill:#9ec8ac}.nd{fill:#9ec8ac}.stp{fill:#1e2620}.stw{fill:#1c3524}}.card,.bg{fill:#fff}.ink-frame{stroke:#252820;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}text{font-kerning:normal;text-rendering:optimizeLegibility}@media(prefers-color-scheme:dark){.card,.bg{fill:#191c1b}.ink-frame{stroke:#eee9de}}</style><path class="card ink-frame" d="M20 7 Q254.23999999999998 4 680 7 Q691 6 691 18 L690 286 Q692 297 680 297 Q336.32 300 20 297 Q9 298 9 286 L10 18 Q8 7 20 7Z"/><text class="ink" x="36" y="48" font-size="21" font-weight="800">One task, one id</text><text class="mut" x="36" y="70" font-size="14.5">task 019 &#8212; &#8220;expire sessions server-side&#8221; &#8212; from roadmap entry to git history</text><path class="stp ink-frame" d="M48 91 Q89.28 88 172 91 Q183 90 183 102 L182 174 Q184 185 172 185 Q107.03999999999999 188 48 185 Q37 186 37 174 L38 102 Q36 91 48 91Z"/><circle class="nd" cx="110" cy="114" r="13"/><text x="110" y="119" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text><text class="ink2" x="110" y="146" font-size="13.5" text-anchor="middle">roadmap</text><text class="ink" x="110" y="166" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">&quot;id&quot;: &quot;019&quot;</text><path class="stp ink-frame" d="M208 91 Q249.28 88 332 91 Q343 90 343 102 L342 174 Q344 185 332 185 Q267.03999999999996 188 208 185 Q197 186 197 174 L198 102 Q196 91 208 91Z"/><circle class="nd" cx="270" cy="114" r="13"/><text x="270" y="119" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text><text class="ink2" x="270" y="146" font-size="13.5" text-anchor="middle">ledger line</text><text class="ink" x="270" y="166" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">notes.jsonl</text><path class="stp ink-frame" d="M368 91 Q409.28 88 492 91 Q503 90 503 102 L502 174 Q504 185 492 185 Q427.03999999999996 188 368 185 Q357 186 357 174 L358 102 Q356 91 368 91Z"/><circle class="nd" cx="430" cy="114" r="13"/><text x="430" y="119" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">3</text><text class="ink2" x="430" y="146" font-size="13.5" text-anchor="middle">code anchor</text><text class="ink" x="430" y="166" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">[Foreman: 019]</text><path class="stw ink-frame" d="M528 91 Q569.28 88 652 91 Q663 90 663 102 L662 174 Q664 185 652 185 Q587.04 188 528 185 Q517 186 517 174 L518 102 Q516 91 528 91Z"/><circle class="nd" cx="590" cy="114" r="13"/><text x="590" y="119" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">4</text><text class="ink2" x="590" y="146" font-size="13.5" text-anchor="middle">commit</text><text class="ac" x="590" y="166" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Foreman: 019</text><rect class="nd" x="36" y="213" width="5" height="5"/><text class="ink2" x="52" y="218" font-size="14">Open a file that carries an anchor &#8594; Foreman hands you what it recorded, before you change it.</text><rect class="nd" x="36" y="241" width="5" height="5"/><text class="ink2" x="52" y="246" font-size="14">Commit mid-task &#8594; Foreman reads the trailer and knows which task that commit closed.</text><rect class="nd" x="36" y="269" width="5" height="5"/><text class="ink2" x="52" y="274" font-size="14">Six months later &#8594; <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">git log --grep=&quot;Foreman: 019&quot;</tspan> is the whole trail.</text></svg>
