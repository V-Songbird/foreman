name: Test

on:
  push:
    branches: [Codex, 'codex/**']
  pull_request:
    branches: [Codex]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve committed line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: manifests parse
        run: node -e 'for (const f of [".codex-plugin/plugin.json","hooks/hooks.json"]) JSON.parse(require("fs").readFileSync(f,"utf-8"))'

      - name: run tests
        run: node --test tests/*.test.js
  runtime-check:
    name: Runtime tests
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every runtime test job to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
