name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve committed line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Manifests and hook registrations parse
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const read = (f) => JSON.parse(fs.readFileSync(f, "utf-8"));
            for (const f of [".claude-plugin/plugin.json", ".codex-plugin/plugin.json", "hooks/hooks.json", "hooks/codex-hooks.json"]) read(f);
            if (read(".codex-plugin/plugin.json").hooks !== "./hooks/codex-hooks.json") {
              throw new Error("the Codex manifest must register hooks/codex-hooks.json");
            }
          '

      - name: No benchmark tree in the package
        shell: bash
        run: |
          if git ls-files | grep -iE '^\.?benchmarks/'; then
            echo "benchmark harnesses belong in Foundry, not in the plugin"
            exit 1
          fi

      - name: README navigation
        run: node scripts/git-hooks/check-readme-nav.js README.md

      - name: Tests
        run: node --test tests/*.test.js

  test:
    name: test
    needs: [suite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite run to pass
        env:
          RESULT: ${{ needs.suite.result }}
        run: test "$RESULT" = success
